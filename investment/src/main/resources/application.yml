spring:
  application:
    name: investment
  jackson:
    deserialization:
      fail-on-unknown-properties: false

budget:
  service:
    url: ${BUDGET_SERVICE_URL:http://localhost:8083}

moex:
  iss:
    base-url: https://iss.moex.com/iss
    timeout-ms: 5000
    connect-timeout-ms: 3000
    snapshot-ttl-minutes: 5
    securities-ttl-hours: 1
    max-connections: 50
    max-connections-per-route: 20

resilience4j:
  circuitbreaker:
    instances:
      moex:
        failureRateThreshold: 50
        slidingWindowSize: 10
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - pyc.lopatuxin.investment.client.moex.MoexNotFoundException
  retry:
    instances:
      moex:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        enableRandomizedWait: true
        randomizedWaitFactor: 0.3
        ignoreExceptions:
          - pyc.lopatuxin.investment.client.moex.MoexNotFoundException
