databaseChangeLog:
  - changeSet:
      id: 007-add-transfer-flag-expense
      author: budget-service
      changes:
        - addColumn:
            tableName: expenses
            columns:
              - column:
                  name: is_transfer
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - sql:
            sql: >
              UPDATE expenses SET is_transfer = TRUE WHERE category_id IN (
                SELECT id FROM categories WHERE name = 'Инвестиции' AND system = TRUE
              );
      rollback:
        - dropColumn:
            tableName: expenses
            columnName: is_transfer

  - changeSet:
      id: 007-add-transfer-flag-income
      author: budget-service
      changes:
        - addColumn:
            tableName: incomes
            columns:
              - column:
                  name: is_transfer
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - sql:
            sql: >
              UPDATE incomes SET is_transfer = TRUE WHERE source = 'INVESTMENTS';
      rollback:
        - dropColumn:
            tableName: incomes
            columnName: is_transfer
