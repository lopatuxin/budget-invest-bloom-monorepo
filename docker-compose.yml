# Modular monolith topology — 4 containers (was 9).
#   postgres        — one PostgreSQL, database `bib`, three schemas (auth/budget/investment)
#   app             — the monolith (single JVM), the only external port 8082
#   frontend        — unchanged Vite dev server, now depends_on: app
#   backup-service  — single `bib` dump + restore test
# The previous microservices topology is kept in docker-compose.microservices.yml
# for rollback until the migration is validated.
services:

  # ========================================
  # DATABASE — one PostgreSQL, database `bib`, three schemas
  # ========================================
  postgres:
    image: postgres:15-alpine
    container_name: bib-postgres
    environment:
      POSTGRES_DB: ${BIB_POSTGRES_DB:-bib}
      POSTGRES_USER: ${BIB_POSTGRES_USER:-bib}
      POSTGRES_PASSWORD: ${BIB_POSTGRES_PASSWORD:?BIB_POSTGRES_PASSWORD must be set}
    # Tuned for a single-user, low-memory footprint.
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=256MB
      - -c
      - max_connections=20
    volumes:
      - bib_postgres_data:/var/lib/postgresql/data
    # Internal to the compose network by default; publishing is optional (admin access).
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BIB_POSTGRES_USER:-bib} -d ${BIB_POSTGRES_DB:-bib}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - finance-network

  # ========================================
  # APPLICATION — the modular monolith (single JVM)
  # ========================================
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: bib-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${BIB_POSTGRES_DB:-bib}
      SPRING_DATASOURCE_USERNAME: ${BIB_POSTGRES_USER:-bib}
      SPRING_DATASOURCE_PASSWORD: ${BIB_POSTGRES_PASSWORD:?BIB_POSTGRES_PASSWORD must be set}
      # Two independent server secrets — injected from .env, no hardcoded defaults.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      AUTH_REFRESH_TOKEN_PEPPER: ${AUTH_REFRESH_TOKEN_PEPPER:?AUTH_REFRESH_TOKEN_PEPPER must be set}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-900000}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-7776000000}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      MOEX_ISS_BASE_URL: ${MOEX_ISS_BASE_URL:-https://iss.moex.com/iss}
    ports:
      - "${APP_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      # Cold start runs three SpringLiquibase + three EntityManagerFactory in sequence.
      start_period: 90s
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - finance-network

  # ========================================
  # FRONTEND — unchanged Vite dev server, now depends on the monolith
  # ========================================
  frontend:
    build:
      context: ./budget-invest-bloom
      target: development
      dockerfile: Dockerfile
    container_name: bib-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:8082"
    volumes:
      - ./budget-invest-bloom/src:/app/src
      - ./budget-invest-bloom/public:/app/public
      - ./budget-invest-bloom/index.html:/app/index.html
      - ./budget-invest-bloom/vite.config.ts:/app/vite.config.ts
      - ./budget-invest-bloom/tsconfig.json:/app/tsconfig.json
      - ./budget-invest-bloom/tsconfig.app.json:/app/tsconfig.app.json
      - ./budget-invest-bloom/tsconfig.node.json:/app/tsconfig.node.json
      - ./budget-invest-bloom/tailwind.config.ts:/app/tailwind.config.ts
      - ./budget-invest-bloom/postcss.config.js:/app/postcss.config.js
      - ./budget-invest-bloom/eslint.config.js:/app/eslint.config.js
      - ./budget-invest-bloom/components.json:/app/components.json
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8082}
    depends_on:
      - app
    networks:
      - finance-network
    restart: unless-stopped
    stdin_open: true
    tty: true

  # ========================================
  # BACKUP — single `bib` dump + weekly restore test
  # ========================================
  backup-service:
    build:
      context: ./scripts/backup
      dockerfile: Dockerfile
    container_name: bib-backup
    environment:
      BIB_POSTGRES_HOST: postgres
      BIB_POSTGRES_DB: ${BIB_POSTGRES_DB:-bib}
      BIB_POSTGRES_USER: ${BIB_POSTGRES_USER:-bib}
      BIB_POSTGRES_PASSWORD: ${BIB_POSTGRES_PASSWORD:?BIB_POSTGRES_PASSWORD must be set}
      # Yandex Disk (native 'yandex' rclone backend via OAuth). Generate with:
      #   rclone authorize "yandex"
      YADISK_OAUTH_TOKEN: ${YADISK_OAUTH_TOKEN}
      YADISK_BACKUP_DIR: ${YADISK_BACKUP_DIR:-backups/budget-invest-bloom}
    volumes:
      - backup_temp:/backups
      - backup_state:/state
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - finance-network

volumes:
  bib_postgres_data:
    driver: local
  backup_temp:
    driver: local
  backup_state:
    driver: local

networks:
  finance-network:
    driver: bridge
